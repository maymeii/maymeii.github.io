<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dubai Chocolate</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>두바이 초콜릿 컬렉션</h1>
    <p>프리미엄 수제 초콜릿</p>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-text">
      <h2>다양한 맛을 한 번에!</h2>
      <p>두바이 프리미엄 수제 초콜릿</p>
    </div>
  </section>

  <!-- PRODUCTS -->
  <section class="products">

    <!-- PRODUCT 1 -->
    <div class="card">
      <img src="images/pistachio.jpg" alt="피스타치오">
      <h3>피스타치오</h3>
      <p>고소한 피스타치오 초콜릿</p>
      <div class="price">19,900원</div>
    </div>

    <!-- PRODUCT 2 -->
    <div class="card">
      <img src="images/caramel.jpg" alt="카라멜">
      <h3>솔티드 카라멜</h3>
      <p>달콤한 카라멜 초콜릿</p>
      <div class="price">21,900원</div>
    </div>

    <!-- PRODUCT 3 -->
    <div class="card">
      <img src="images/chocolate.jpg" alt="초콜릿">
      <h3>초콜릿</h3>
      <p>진한 다크 초콜릿</p>
      <div class="price">19,900원</div>
    </div>

    <!-- PRODUCT 4 -->
    <div class="card">
      <img src="images/coconut.jpg" alt="코코넛">
      <h3>코코넛</h3>
      <p>달콤한 코코넛 초콜릿</p>
      <div class="price">19,900원</div>
    </div>

    <!-- PRODUCT 5 -->
    <div class="card">
      <img src="images/rose.jpg" alt="로즈">
      <h3>로즈</h3>
      <p>향긋한 장미 초콜릿</p>
      <div class="price">21,900원</div>
    </div>

    <!-- PRODUCT 6 -->
    <div class="card">
      <img src="images/coffee.jpg" alt="커피">
      <h3>커피</h3>
      <p>깊은 커피 향 초콜릿</p>
      <div class="price">19,900원</div>
    </div>

  </section>

  <!-- FOOTER -->
  <footer>
    © 2026 Dubai Chocolate Store
  </footer>

</body>
</html>
