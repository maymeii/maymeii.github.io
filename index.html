<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두바이 초콜릿 A/B 테스팅 - Version A</title>
    <style>
        :root {
            --primary-gold: #b38b4d;
            --dark-brown: #3e2723;
            --bg-beige: #f9f6f2;
        }
        body { margin: 0; font-family: 'Malgun Gothic', sans-serif; background-color: var(--bg-beige); text-align: center; }
        
        header { background: white; padding: 20px; border-bottom: 1px solid #eee; }
        .logo { font-size: 24px; font-weight: 800; color: var(--primary-gold); }

        .test-container { max-width: 1000px; margin: 40px auto; padding: 20px; }
        .test-version { display: none; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* Hiển thị phiên bản đang được chọn */
        .active { display: block; animation: fadeIn 0.5s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .hero-image { width: 100%; max-height: 500px; object-fit: cover; border-radius: 10px; margin-bottom: 20px; }
        
        .headline { font-size: 32px; color: var(--dark-brown); margin-bottom: 15px; }
        .subtext { color: #666; margin-bottom: 25px; }

        .cta-button { 
            background: var(--dark-brown); color: white; border: none; 
            padding: 18px 40px; font-size: 18px; font-weight: bold; 
            border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        .cta-button:hover { background: var(--primary-gold); }

        /* Bảng điều khiển để so sánh */
        .controls { margin-top: 50px; padding: 20px; border-top: 1px dashed #ccc; background: #fff; }
        .btn-toggle { padding: 10px 20px; margin: 5px; cursor: pointer; border: 1px solid var(--dark-brown); background: white; border-radius: 5px; }
        .btn-toggle:hover { background: var(--bg-beige); }
    </style>
</head>
<body>

<header>
    <div class="logo">DUBAI CHOCOLATE</div>
</header>

<div class="test-container">
    
    <!-- VERSION A: Multiple Products (Hình ảnh nhiều sản phẩm trong 1 khung hình) -->
    <div id="versionA" class="test-version active">
        <p style="color: var(--primary-gold); font-weight: bold;">[광고 시안 A: 버라이어티 팩]</p>
        <h1 class="headline">다양한 맛을 한 번에! 두바이 초콜릿 컬렉션</h1>
        <p class="subtext">피스타치오, 카라멜, 티라미수 등 8가지 프리미엄 맛을 한 상자에 담았습니다.</p>
        <!-- Ảnh minh họa nhiều sản phẩm (Concept image_3.png)[span_0](start_span)[span_0](end_span) -->
        <img src="https://images.unsplash.com/photo-1549007994-cb92caebd54b?q=80&w=1000" class="hero-image" alt="Nhiều sản phẩm Dubai Chocolate">
        <button class="cta-button" onclick="trackClick('A')">컬렉션 전체 구매하기</button>
    </div>

    <!-- VERSION B: Single Key Product (Chỉ dành để đối chiếu khi cần) -->
    <div id="versionB" class="test-version">
        <p style="color: var(--primary-gold); font-weight: bold;">[광고 시안 B: 단일 주력 상품]</p>
        <h1 class="headline">단 하나의 압도적 풍미, 오리지널 피스타치오</h1>
        <p class="subtext">가장 사랑받는 베스트셀러, 피스타치오 초콜릿의 진수를 경험하세요.</p>
        <img src="https://images.unsplash.com/photo-1511381939415-e44015466834?q=80&w=1000" class="hero-image" alt="Một sản phẩm chủ lực">
        <button class="cta-button" onclick="trackClick('B')">피스타치오 구매하기</button>
    </div>

</div>

<div class="controls">
    <p><strong>A/B 테스팅 시뮬레이터</strong> (비교용 버튼):</p>
    <button class="btn-toggle" onclick="showVersion('A')">시안 A 보기 (다수 제품)</button>
    <button class="btn-toggle" onclick="showVersion('B')">시안 B 보기 (단일 제품)</button>
</div>

<script>
    // Hàm chuyển đổi thủ công giữa các phiên bản
    function showVersion(v) {
        // Loại bỏ lớp 'active' ở tất cả phiên bản
        document.getElementById('versionA').classList.remove('active');
        document.getElementById('versionB').classList.remove('active');
        
        // Hiển thị phiên bản được chọn
        document.getElementById('version' + v).classList.add('active');
    }

    // Ghi nhận dữ liệu nhấp chuột (Simulated)
    function trackClick(version) {
        alert("시안 " + version + "의 클릭율(CTR) 데이터가 전송되었습니다.");
    }
</script>

</body>
</html>
