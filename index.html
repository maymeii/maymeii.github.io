<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dubai Chocolate - Premium Collection</title>
    <style>
        :root {
            --primary-gold: #b38b4d;
            --dark-brown: #3e2723;
            --bg-beige: #f9f6f2;
            --white: #ffffff;
        }
        body { margin: 0; font-family: 'Malgun Gothic', sans-serif; background-color: var(--bg-beige); text-align: center; color: var(--dark-brown); line-height: 1.6; }
        
        header { background: var(--white); padding: 20px; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 900; color: var(--primary-gold); letter-spacing: 3px; }

        .main-container { max-width: 1000px; margin: 40px auto; padding: 40px 20px; background: var(--white); border-radius: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); }

        .headline { font-size: 38px; font-weight: 800; margin-bottom: 10px; color: var(--dark-brown); }
        .subtext { font-size: 18px; color: #777; margin-bottom: 45px; }

        /* Collage Grid Layout - Lấy cảm hứng trực tiếp từ image_5.png */
        .collage-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 60px;
            border-radius: 20px;
            overflow: hidden;
        }
        .collage-item { 
            width: 100%; 
            aspect-ratio: 1 / 1; 
            object-fit: cover; 
            transition: all 0.4s ease;
            cursor: pointer;
        }
        .collage-item:hover { transform: scale(1.03); filter: brightness(1.1); }

        /* Section Best Sellers */
        .best-seller-section { margin-top: 50px; text-align: left; padding: 0 10px; }
        .section-title { 
            font-size: 26px; 
            font-weight: 800;
            border-left: 6px solid var(--primary-gold); 
            padding-left: 15px; 
            margin-bottom: 30px; 
            display: flex;
            align-items: center;
        }
        
        .product-list { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 25px; 
        }
        .product-card { 
            background: #fff; 
            border: 1px solid #f0e6d6;
            border-radius: 15px; 
            padding: 20px; 
            display: flex; 
            align-items: center; 
            gap: 20px;
            transition: 0.3s;
        }
        .product-card:hover { border-color: var(--primary-gold); box-shadow: 0 5px 15px rgba(179, 139, 77, 0.1); }
        
        .product-img-small { 
            width: 100px; 
            height: 100px; 
            border-radius: 12px; 
            object-fit: cover; 
            background: #eee;
        }
        .product-info h3 { margin: 0; font-size: 20px; color: var(--dark-brown); }
        .product-info p { margin: 8px 0 0; font-size: 15px; color: #888; }

        .footer-cta { margin-top: 60px; padding: 40px 0; border-top: 1px solid #eee; }
        .cta-button { 
            background: var(--dark-brown); 
            color: var(--white); 
            border: none; 
            padding: 22px 80px; 
            font-size: 22px; 
            font-weight: bold; 
            border-radius: 60px; 
            cursor: pointer; 
            transition: 0.3s;
            box-shadow: 0 15px 30px rgba(62, 39, 35, 0.2);
        }
        .cta-button:hover { 
            background: var(--primary-gold); 
            transform: translateY(-5px); 
            box-shadow: 0 20px 40px rgba(179, 139, 77, 0.3);
        }
    </style>
</head>
<body>

<header>
    <div class="logo">DUBAI CHOCOLATE</div>
</header>

<div class="main-container">
    <h1 class="headline">더 다채로운 두바이의 맛</h1>
    <p class="subtext">프리미엄 피스타치오와 카다이프의 환상적인 하모니</p>

    <!-- Grid Collage mô phỏng image_5.png -->
    <div class="collage-grid">
        <!-- Thay thế bằng link ảnh thực tế từ image_5.png nếu bạn có host ảnh -->
        <img src="https://images.unsplash.com/photo-1549007994-cb92caebd54b?w=500" class="collage-item" alt="Collection 1">
        <img src="https://images.unsplash.com/photo-1511381939415-e44015466834?w=500" class="collage-item" alt="Pistachio Detail">
        <img src="https://images.unsplash.com/photo-1623156311000-8488e08d660e?w=500" class="collage-item" alt="Handmade process">
        <img src="https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?w=500" class="collage-item" alt="Variety box">
        <img src="https://images.unsplash.com/photo-1550186082-670cdd604276?w=500" class="collage-item" alt="Premium Ingredients">
        <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=500" class="collage-item" alt="Lifestyle shot">
    </div>

    <!-- Section Best Sellers với hình ảnh đính kèm -->
    <div class="best-seller-section">
        <h2 class="section-title">Best Sellers</h2>
        <div class="product-list">
            <!-- Sản phẩm 1 -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1511381939415-e44015466834?w=200" class="product-img-small" alt="Pistachio Original">
                <div class="product-info">
                    <h3>오리지널 피스타치오</h3>
                    <p>바삭한 카다이프와 고소함의 끝판왕</p>
                </div>
            </div>
            <!-- Sản phẩm 2 -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1534706936160-d5ee67737249?w=200" class="product-img-small" alt="Salted Caramel">
                <div class="product-info">
                    <h3>솔티드 카라멜</h3>
                    <p>단짠의 완벽한 조화, 멈출 수 없는 맛</p>
                </div>
            </div>
            <!-- Sản phẩm 3 -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1549007994-cb92caebd54b?w=200" class="product-img-small" alt="Dark Tiramisu">
                <div class="product-info">
                    <h3>다크 티라미수</h3>
                    <p>에스프레소 향 가득한 프리미엄 라인</p>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-cta">
        <button class="cta-button">지금 바로 주문하기</button>
    </div>
</div>

<footer style="padding: 40px; color: #aaa; font-size: 14px;">
    &copy; 2026 Dubai Chocolate Premium. All rights reserved.
</footer>

</body>
</html>
